# DiffDock environment (docking application only), as used for the reported runs: DiffDock (gcorso/DiffDock,
# commit 85c49b6) on torch 2.0.1 + CUDA 11.8. Create it with envs/install_diffdock.sh, which also clones DiffDock
# and applies envs/diffdock_parse_chi.patch.
name: siteseer-diffdock
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.9.18
  - pip
  - setuptools=69.5.1
  - prody=2.2.0
  - scipy=1.12.0
  - numpy=1.26.4
  - biopython=1.85
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu118
      - --find-links https://data.pyg.org/whl/torch-2.0.1+cu118.html
      - torch==2.0.1+cu118
      - torch-geometric==2.6.1
      - torch-scatter==2.1.2+pt20cu118
      - torch-sparse==0.6.18+pt20cu118
      - torch-cluster==1.6.3+pt20cu118
      - torch-spline-conv==1.2.2+pt20cu118
      - e3nn==0.5.0
      - fair-esm==2.0.0
      - rdkit==2025.9.2
      - pandas==2.3.3
      - networkx==3.2.1
      - scikit-learn==1.6.1
      - pyyaml==6.0.3
      - tqdm==4.67.3
