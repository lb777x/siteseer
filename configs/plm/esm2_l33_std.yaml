# ESM-2 650M, last layer (33) with its final LayerNorm, standardised per dimension like the main model's layer 30: the
# control that separates the layer from the standardisation. Overlay on configs/main/*.yaml.
encoder: esm_raw
data:
  esm_model: esm2_t33_650M_UR50D
  esm_layer: 33
  norm_stats: data/norm_stats/esm2_l33.pt
  embedding_dir: data/embeddings_goliath_esm2_l33
