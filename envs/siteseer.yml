# Main environment: ESM-2 embeddings, training, evaluation, statistics, figures, structural ablation, UMAP.
# Versions as used for the reported results. CUDA 12.1 wheels; they also run on CPU.
#   conda env create -f envs/siteseer.yml && conda activate siteseer && pip install -e .
name: siteseer
channels:
  - conda-forge
dependencies:
  - python=3.12.14
  - pip
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu121
      - torch==2.5.1+cu121
      - fair-esm==2.0.0
      - numpy==2.2.6
      - pandas==3.0.6
      - scipy==1.13.1
      - scikit-learn==1.9.1
      - pyyaml==6.0.3
      - biopython==1.88
      - torch-geometric==2.8.0.post1
      - matplotlib==3.11.2
      - umap-learn==0.5.12
      - requests==2.34.2
      - tqdm==4.70.1
      - pytest==9.1.1
