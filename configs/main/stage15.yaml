# Main model, stage 1.5: real-label subset of the Goliath pool (fix2); warm start from stage 1.
run_name: main_stage15
seed: 42
data:
  dataset_class: goliath
  train_csv: dataset/label_diffusion/cached_dataframe_real_labels_only_fix2.csv
  id_column: alphafolddb-id
  esm_layer: 30
  norm_stats: data/embeddings_goliath_esm2_l30/norm_stats.pt
  embedding_dir: data/embeddings_goliath_esm2_l30
probe:
  mode: agnostic
  hidden_dim: 128
  dropout: 0.2
  loss: focal
  focal_alpha: 0.8
  focal_gamma: 2.0
optim:
  lr: 0.0005
  weight_decay: 0.0001
  epochs: 15
  batch_size: 8
logging:
  log_every_n_steps: 200
  eval_every_n_epochs: 1
  checkpoint_dir: checkpoints
