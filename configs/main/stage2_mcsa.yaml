# Main model, stage 2: M-CSA single split (live ESM-2 embeddings); warm start from stage 1.5. Seeds: --set seed=43 run_name=main_stage2_mcsa_seed43
run_name: main_stage2_mcsa
seed: 42
data:
  train_csv: dataset/mcsa_fine_tune/normal_mcsa/train_dataset/mcsa_train.csv
  valid_csv: dataset/mcsa_fine_tune/normal_mcsa/valid_dataset/mcsa_valid.csv
  test_csv: dataset/mcsa_fine_tune/normal_mcsa/test_dataset/mcsa_test.csv
  id_column: alphafolddb-id
  esm_layer: 30
  norm_stats: data/embeddings_goliath_esm2_l30/norm_stats.pt
probe:
  mode: agnostic
  hidden_dim: 128
  dropout: 0.2
  loss: focal
  focal_alpha: 0.8
  focal_gamma: 2.0
optim:
  lr: 0.0003
  weight_decay: 0.0001
  epochs: 20
  batch_size: 8
logging:
  log_every_n_steps: 20
  eval_every_n_epochs: 2
  checkpoint_dir: checkpoints
