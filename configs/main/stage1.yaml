# Main model, stage 1: Goliath pool (fix2), cached ESM-2 650M layer-30 embeddings, standardised.
run_name: main_stage1
seed: 42
data:
  dataset_class: goliath
  train_csv: dataset/label_diffusion/cached_dataframe_fully_excl_fix2.csv
  id_column: alphafolddb-id
  esm_layer: 30
  norm_stats: data/embeddings_goliath_esm2_l30/norm_stats.pt
  embedding_dir: data/embeddings_goliath_esm2_l30
probe:
  mode: agnostic
  hidden_dim: 128
  dropout: 0.2
  loss: focal
  focal_alpha: 0.8
  focal_gamma: 2.0
optim:
  lr: 0.001
  weight_decay: 0.0001
  epochs: 20
  batch_size: 8
logging:
  log_every_n_steps: 200
  eval_every_n_epochs: 1
  checkpoint_dir: checkpoints
